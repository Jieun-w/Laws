<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#315fe8"><title>법 조문 플래시카드</title>
<style>
:root{--ink:#19243b;--muted:#68758c;--line:#e0e7f2;--blue:#315fe8;--blue2:#2346b2;--pale:#eef2ff;--bg:#f4f6fc;--green:#167a62}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#e8edff 0,transparent 42%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:auto;padding:20px 15px 50px}.hero{background:linear-gradient(135deg,#2e55d4,#657ff2);color:white;border-radius:24px;padding:23px 21px;box-shadow:0 12px 28px #315fe826}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;opacity:.85}.hero h1{font-size:27px;line-height:1.25;letter-spacing:-.04em;margin:5px 0 8px}.hero p{font-size:14px;color:#eef2ff;margin:0}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.pill{font-size:12px;font-weight:750;padding:5px 10px;border:1px solid #ffffff55;border-radius:999px;background:#ffffff1c}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px;box-shadow:0 3px 12px #20315c08}.label{font-size:12px;font-weight:850;color:var(--muted);display:block;margin-bottom:8px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{font:inherit;font-weight:800;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--blue2);padding:11px 12px;cursor:pointer;touch-action:manipulation}.btn:focus-visible{outline:3px solid #9bb0ff;outline-offset:2px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.selected{background:var(--pale);border-color:#b9c8ff;color:var(--blue2)}.btn:disabled{opacity:.4;cursor:default}
.stats{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:750}.track{height:8px;border-radius:99px;background:#e8edf7;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:linear-gradient(90deg,#315fe8,#38a88a);transition:width .2s}.card{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 9px 24px #20315c0d;overflow:hidden}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:16px 18px 0}.tag{font-size:11px;font-weight:900;letter-spacing:.04em;color:var(--blue);background:var(--pale);padding:5px 9px;border-radius:999px}.cardnum{font-size:12px;color:var(--muted);font-weight:800}.question{padding:22px 20px 25px;min-height:150px;display:flex;align-items:center;font-size:19px;line-height:1.7;font-weight:780;overflow-wrap:anywhere;white-space:pre-wrap}.answer{border-top:1px dashed #cfd8ee;background:linear-gradient(180deg,#fbfcff,#fff);padding:18px 20px 20px;white-space:pre-wrap;overflow-wrap:anywhere}.answer[hidden]{display:none}.answerlabel{font-size:11px;font-weight:900;color:var(--green);margin-bottom:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.controls .btn{padding:13px 10px}.done-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:13px;padding:13px 15px;background:#f8faff;border:1px solid var(--line);border-radius:14px}.checklabel{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;cursor:pointer}.checklabel input{width:21px;height:21px;accent-color:var(--green)}.small{font-size:12px;color:var(--muted)}.extras{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.extras .btn{flex:1;min-width:130px}.foot{font-size:12px;color:var(--muted);margin:20px 3px 0;line-height:1.6}
@media(min-width:600px){.wrap{padding-top:28px}.hero{padding:29px}.question{font-size:21px;min-height:180px;padding:28px 25px}.answer{padding:22px 25px}}
</style></head><body><main class="wrap">
<header class="hero"><div class="eyebrow">LAW STUDY DECK</div><h1>법 조문 플래시카드</h1><p>질문을 보고 먼저 답을 떠올린 뒤, 정답을 확인해 봐.</p><div class="pills"><span class="pill">45개 카드</span><span class="pill">2가지 암기 모드</span><span class="pill">진도 자동 저장</span></div></header>
<section class="panel"><span class="label">암기 모드 선택</span><div class="modes"><button class="btn selected" id="modeLaw">① 법·조문 → 전문</button><button class="btn" id="modeText">② 전문 → 법·조문</button></div></section>
<section class="panel"><div class="stats"><span id="progressText">암기 완료 0 / 45</span><span id="cardPosition">1 / 45</span></div><div class="track"><div class="fill" id="progressFill"></div></div><div class="extras"><button class="btn" id="shuffleBtn">🔀 무작위 섞기</button><button class="btn" id="unlearnedBtn">아직 안 외운 카드만</button></div></section>
<section class="card" aria-live="polite"><div class="cardtop"><span class="tag" id="sideTag">QUESTION</span><span class="cardnum" id="indexTag">CARD 1</span></div><div class="question" id="question"></div><div class="answer" id="answer" hidden><div class="answerlabel" id="answerLabel">정답</div><div id="answerText"></div></div></section>
<div class="controls"><button class="btn primary" id="revealBtn">정답 확인</button><button class="btn" id="doneBtn">✓ 암기 완료 표시</button><button class="btn" id="prevBtn">← 이전 카드</button><button class="btn" id="nextBtn">다음 카드 →</button></div>
<div class="done-row"><label class="checklabel"><input type="checkbox" id="doneCheck"><span>이 조문 암기 완료</span></label><span class="small" id="doneHint">체크 상태는 이 기기에 저장돼.</span></div>
<p class="foot">※ 암기 완료 상태는 같은 브라우저의 이 기기에 저장돼. 원본 자료에서 반복되거나 서로 맞지 않아 보이는 항목도 내용을 임의로 고치지 않고 카드로 유지했어.</p>
</main>
<script>
const allCards = [{"law": "수권법(독일) 제1조", "text": "라이히 법률은 라이히 헌법에서 규정하는 절차에 따르는 것 외에, 라이히 정부에 의해서도 의결될 수 있다."}, {"law": "수권법(독일) 제2조", "text": "라이히 정부가 의결하는 법률은 라이히 헌법과는 다른 규정을 만들 수 있다."}, {"law": "헌법 제40조", "text": "입법권은 국회에 속한다."}, {"law": "헌법 제60조 제4항", "text": "행정권은 대통령을 수반으로 하는 정부에 속한다."}, {"law": "헌법 제101조 제1항", "text": "사법권은 법관으로 구성된 법원에 속한다."}, {"law": "헌법 제41조", "text": "1- 국회는 국민의 보통, 평등, 직접, 비밀선거에 의하여 선출된 국회의원으로 구성한다.\n2- 국회의원 수는 법률로 정하되, 200인 이상으로 한다.\n3- 국회의원의 선거구와 비례대표제 기타 선거에 관한 사항은 법률로 정한다."}, {"law": "헌법 제42조", "text": "국회의원의 임기는 4년으로 한다."}, {"law": "헌법 제70조", "text": "대통령의 임기는 5년으로 하며, 중임할 수 없다."}, {"law": "헌법 제67조 제1항·제3항·제4항·제5항", "text": "1- 대통령은 국민의 보통, 평등, 직접, 비밀선거에 의하여 선출한다.\n3- 대통령후보자가 1인일 때에는 그 득표수가 선거권자 총수의 3분의 1이상이 아니면 대통령으로 당선될 수 없다.\n4- 대통령으로 선거될 수 있는 자는 국회의원의 피선거권이 있고 선거일 현재 40세에 달하여야 한다.\n5- 대통령의 선거에 관한 사항은 법률로 정한다."}, {"law": "헌법 제76조", "text": "1- 대통령은 내우, 외환, 천재, 지변 또는 중대한 재정, 경제상의 위기에 있어서 국가의 안전보장 또는 공공의 안녕질서를 유지하기 위하여 긴급한 조치가 필요하고 국회의 집회를 기다릴 여유가 없을 때에 한하여 최소한으로 필요한 재정, 경제상의 처분을 하거나 이에 관하여 법률의 효력을 가지는 명령을 발할 수 있다.\n2- 대통령은 국가의 안위에 관계되는 중대한 고전상태에 있어서 국가를 보위하기 위하여 긴급한 조치가 필요하고 국회의 집회가 불가능한 때에 한하여 법률의 효력을 가지는 명령을 발할 수 있다."}, {"law": "헌법 제77조 제1항", "text": "대통령은 전시, 사변 또는 이에 준하는 국가 비상사태에 있어서 병력으로써 군사상의 필요에 응하거나 공공의 안녕질서를 유지할 필요가 있을 때에는 법률이 정하는 바에 의하여 계엄을 선포할 수 있다."}, {"law": "헌법 제128조", "text": "1- 헌법 개정은 국회재적의원 과반수 또는 대통령의 발의로 제안된다.\n2- 대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다."}, {"law": "헌법 제129조", "text": "제안된 헌법개정안은 대통령이 20일 이상의 기간 이를 공고하여야 한다."}, {"law": "헌법 제130조", "text": "1- 국회는 헌법 개정안이 공고된 날로부터 60일 이내에 의결하여야 하며, 국회의 의결은 재적의원 3분의 2이상의 찬성을 얻어야 한다.\n2- 헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원 선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻어야 한다.\n3- 헌법개정안이 제2항의 찬성을 얻은 때에는 헌법개정은 확정되며, 대통령은 즉시 이를 공포하여야 한다."}, {"law": "헌법 제72조", "text": "대통령은 필요하다고 인정할 때에는 외교, 국방, 통일 기타 국가안위에 관한 중요 정책을 국민투표에 붙일 수 있다."}, {"law": "공직선거법 제187조", "text": "헌법에 따라 대통령은 선거에서 유효 투표의 다수를 얻은 후보자가 당선된다."}, {"law": "헌법 제1조", "text": "1- 대한민국은 민주공화국이다.\n2- 대한민국의 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다."}, {"law": "헌법 제8조 제2항", "text": "정당은 그 목적, 조직과 활동이 민주적이어야 하며, 국민의 정치적 의사형성에 참여하는 데 필요한 조직을 가져야 한다."}, {"law": "헌법 제10조 (국민주권주의 항목에 수록)", "text": "모든 국민은 인간으로서의 존엄과 가치를 가지며, 행복을 추구할 권리를 가진다. 개인이 가지는 불가침의 기본적 인권을 확인하고 이를 보장할 의무를 가진다."}, {"law": "헌법 제34조", "text": "1- 모든 국민은 인간다운 생활을 할 권리를 가진다.\n2- 국가는 사회보장, 사회복지의 증진에 노력할 의무를 진다."}, {"law": "헌법 제119조 제2항", "text": "국가는 균형 있는 국민경제의 성장 및 안정과 적정한 소득의 분배를 유지하고, 시장의 지배와 경제력의 남용을 방지하며, 경제 주체간의 조화를 통한 경제의 민주화를 위하여 경제에 관한 규제와 조정을 할 수 있다."}, {"law": "헌법 제9조", "text": "국가는 전통문화의 계승, 발전과 민족문화의 창달에 노력하여야 한다."}, {"law": "헌법 제22조 제1항", "text": "모든 국민은 학문과 예술의 자유를 가진다."}, {"law": "헌법 제31조 제5항", "text": "국가는 평생교육을 진흥하여야 한다."}, {"law": "헌법 제5조 제1항", "text": "대한민국은 국제평화의 유지에 노력하고 침략적 전쟁을 부인한다."}, {"law": "헌법 제6조", "text": "1- 헌법에 의하여 체결, 공포된 조약과 일반적으로 승인된 국제 법규는 국내법과 같은 효력을 가진다.\n2- 외국인은 국제법과 조약이 정하는 바에 의하여 그 지위가 보장된다."}, {"law": "헌법 제4조", "text": "대한민국은 통일을 지향하며, 자유민주적 기본질서에 입각한 평화적 통일정책을 수립하고 이를 추진한다."}, {"law": "헌법 제66조 제3항", "text": "대통령은 조국의 평화적 통일을 위한 성실한 의무를 진다."}, {"law": "헌법 제10조 (인간의 존엄과 가치 및 행복 추구권 항목에 수록)", "text": "모든 국민은 인간으로서의 존엄과 가치를 가지며, 행복을 추구할 권리를 가진다. 국가는 개인이 가지는 불가침의 기본적 인권을 확인하고 이를 보장할 의무를 진다."}, {"law": "헌법 제11조 제1항", "text": "모든 국민은 법 앞에 평등하다. 누구든지 성별, 종교 또는 사회적 신분에 의하여 정치적, 경제적, 사회적, 문화적 생활의 모든 영역에 있어서 차별을 받지 아니한다."}, {"law": "헌법 제24조", "text": "모든 국민은 법률이 정하는 바에 의하여 선거권을 가진다."}, {"law": "헌법 제25조", "text": "모든 국민은 법률이 정하는 바에 의하여 공무 담임권을 가진다."}, {"law": "헌법 제31조 제1항", "text": "모든 국민은 능력에 따라 균등하게 교육을 받을 권리를 가진다."}, {"law": "헌법 제32조 제1항", "text": "모든 국민은 근로의 권리를 가진다. 국가는 사회 경제적 방법으로 근로자의 고용의 증진과 적정임금의 보장에 노력하여야 하며, 법률이 정하는 바에 의하여 최저임금제를 시행하여야 한다."}, {"law": "헌법 제34조 제1항 (사회권 항목에 수록)", "text": "모든 국민은 인간다운 생활을 할 권리를 가진다."}, {"law": "헌법 제32조 제1항 (자료의 다음 줄에 별도로 수록)", "text": "모든 국민은 인간다운 생활을 할 권리를 가진다."}, {"law": "헌법 제26조 제1항", "text": "모든 국민은 법률이 정하는 바에 의하여 국가기관에 문서로 청원할 권리를 가진다."}, {"law": "헌법 제27조 제1항", "text": "모든 국민은 헌법과 법률이 정한 법관에 의하여 법률에 의한 재판을 받을 권리를 가진다."}, {"law": "헌법 제28조", "text": "형사피의자 또는 형사 피고인으로서 구금되었던 자가 법률이 정하는 불기소처분을 받거나 무죄판결을 받은 때에는 법률이 정하는 바에 의하여 국가에 정당한 보상을 청구할 수 있다."}, {"law": "헌법 제30조", "text": "타인의 범죄행위로 인하여 생명·신체에 대한 피해를 받은 국민은 법률이 정하는 바에 의하여 국가로부터 구조받을 수 있다."}, {"law": "헌법 제37조 제2항", "text": "국민의 모든 자유와 권리는 국가 안전 보장, 질서유지 또는 공공복리를 위하여 필요한 경우에 한하여 법률로써 제한할 수 있으며, 제한하는 경우에도 자유와 권리의 본질적인 내용은 침해할 수 없다."}, {"law": "헌법 제101조", "text": "1- 사법권은 법관으로 구성된 법원에 속한다.\n2- 법원은 최고법원인 대법원과 각급법원으로 조직된다.\n3- 법관의 자격은 법률로 정한다."}, {"law": "형법 제260조 제1항 (폭행, 존속폭행)", "text": "사람의 신체에 대하여 폭행을 가한 자는 2년 이하 징역, 500만원 이하의 벌금, 구류 또는 과료에 처한다."}, {"law": "형법 제10조 제2항", "text": "심신 미약자의 행위는 형을 감경할 수 있다."}, {"law": "형법 제25조 (미수범)", "text": "1- 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌한다.\n2- 미수범의 형은 기수범보다 감경할 수 있다."}];
const STORAGE_KEY = 'law-flashcards-progress-v1';
let mode = 'law';
let order = allCards.map((_, i) => i);
let position = 0;
let onlyUnlearned = false;
let learned = {};
try { learned = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch (e) { learned = {}; }
const $ = id => document.getElementById(id);
function currentCard(){ return allCards[order[position]]; }
function answerFor(c){ return mode === 'law' ? c.text : c.law; }
function questionFor(c){ return mode === 'law' ? c.law : c.text; }
function learnedKey(i){ return mode + ':' + i; }
function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(learned)); } catch(e) {} }
function shuffleArray(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function visibleOrder(){ return allCards.map((_,i)=>i).filter(i=>!onlyUnlearned || !learned[learnedKey(i)]); }
function shuffleCards(){ order=shuffleArray(visibleOrder()); position=0; render(); }
function setMode(next){ mode=next; $('modeLaw').classList.toggle('selected',mode==='law'); $('modeText').classList.toggle('selected',mode==='text'); order=visibleOrder(); position=0; render(); }
function render(){
 const total=order.length;
 if(!total){$('question').textContent='모든 카드에 암기 완료 표시가 되어 있어!';$('answer').hidden=true;$('sideTag').textContent='완료';$('indexTag').textContent='0 / 0';$('cardPosition').textContent='0 / 0';$('prevBtn').disabled=true;$('nextBtn').disabled=true;$('revealBtn').disabled=true;$('doneBtn').disabled=true;$('doneCheck').checked=false;updateProgress();return;}
 if(position>=total)position=total-1;
 const i=order[position], c=allCards[i];
 $('question').textContent=questionFor(c);$('answerText').textContent=answerFor(c);$('answerLabel').textContent=mode==='law'?'조문 전문':'법 이름·조문 번호';$('answer').hidden=true;$('revealBtn').textContent='정답 확인';$('sideTag').textContent=mode==='law'?'LAW → TEXT':'TEXT → LAW';$('indexTag').textContent='CARD '+(position+1);$('cardPosition').textContent=(position+1)+' / '+total;$('prevBtn').disabled=position===0;$('nextBtn').disabled=position===total-1;$('revealBtn').disabled=false;$('doneBtn').disabled=false;$('doneCheck').checked=!!learned[learnedKey(i)];$('doneBtn').textContent=$('doneCheck').checked?'✓ 암기 완료됨':'✓ 암기 완료 표시';updateProgress();
}
function updateProgress(){let count=allCards.reduce((n,_,i)=>n+(learned[mode+':'+i]?1:0),0);$('progressText').textContent='암기 완료 '+count+' / '+allCards.length;$('progressFill').style.width=(count/allCards.length*100)+'%';}
function toggleAnswer(){if(!$('answer').hidden){$('answer').hidden=true;$('revealBtn').textContent='정답 확인';}else{$('answer').hidden=false;$('revealBtn').textContent='정답 숨기기';}}
function setLearned(value){if(!order.length)return;learned[learnedKey(order[position])]=value;save();render();}
$('modeLaw').addEventListener('click',()=>setMode('law'));
$('modeText').addEventListener('click',()=>setMode('text'));
$('shuffleBtn').addEventListener('click',shuffleCards);
$('unlearnedBtn').addEventListener('click',()=>{onlyUnlearned=!onlyUnlearned;$('unlearnedBtn').textContent=onlyUnlearned?'전체 카드 보기':'아직 안 외운 카드만';order=visibleOrder();position=0;render();});
$('revealBtn').addEventListener('click',toggleAnswer);
$('doneBtn').addEventListener('click',()=>setLearned(!learned[learnedKey(order[position])]));
$('doneCheck').addEventListener('change',e=>setLearned(e.target.checked));
$('prevBtn').addEventListener('click',()=>{if(position>0){position--;render();}});
$('nextBtn').addEventListener('click',()=>{if(position<order.length-1){position++;render();}});
render();
</script></body></html>
